<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap');

        /* ------------------------------
 | MODULAR TYPE SCALE
 | ------------------------------
 | Helps you create type scales that bring natural rhythm,
 | consistency, and balance to your designs.
 |
 | BASE VALUES:
 | - Font Size: 16px / 1rem
 | - Line Height: 24px / 1.5
 | - Letter Spacing: 3.5% / 0.035em
 |
 | SCALE:
 | - Ratio: 1.26 - Major Third
 |
 | LINE GRID:
 | - Grid Unit: 4px / 0.25rem
 |
 |
 | Scale ratio is calculated using an equal temperament tuning system.
 | Created with Precise Type / https://precise-type.com
 | Tools & Models by Adonis Raul Raduca
 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* --- Font Sizes --- */

        :root {
            /* below the base */
            --font-size-2b: 0.625rem;
            --font-size-1b: 0.8125rem;

            /* the base */
            --font-size: 1rem;

            /* above the base */
            --font-size-1: 1.25rem;
            --font-size-2: 1.5625rem;
            --font-size-3: 2rem;
            --font-size-4: 2.5rem;
            --font-size-5: 3.1875rem;
            --font-size-6: 4rem;
            --font-size-7: 5.0625rem;
            --font-size-8: 6.375rem;
            --font-size-9: 8rem;
            --font-size-10: 10.0625rem;
        }

        /* --- Line Heights --- */

        :root {
            /* below the base */
            --line-height-2b: 2;
            --line-height-1b: 1.5385;

            /* the base */
            --line-height: 1.5;

            /* above the base */
            --line-height-1: 1.4;
            --line-height-2: 1.28;
            --line-height-3: 1.25;
            --line-height-4: 1.2;
            --line-height-5: 1.1765;
            --line-height-6: 1.125;
            --line-height-7: 1.0864;
            --line-height-8: 1.098;
            --line-height-9: 1.0625;
            --line-height-10: 1.0435;
        }

        /* --- Letter Spacings --- */

        :root {
            /* below the base */
            --letter-space-2b: 0.074em;
            --letter-space-1b: 0.05em;

            /* the base */
            --letter-space: 0.035em;

            /* above the base */
            --letter-space-1: 0.022em;
            --letter-space-2: 0.0116em;
            --letter-space-3: 0.0025em;
            --letter-space-4: -0.004em;
            --letter-space-5: -0.0096em;
            --letter-space-6: -0.0137em;
            --letter-space-7: -0.0172em;
            --letter-space-8: -0.0198em;
            --letter-space-9: -0.0219em;
            --letter-space-10: -0.0235em;
        }

        /* ------------------------------
 | Examples
 */

        /* --- Default Text --- */

        body {
            font-weight: 400;
            font-size: var(--font-size);
            line-height: var(--line-height);
            letter-spacing: var(--letter-space);
            font-family: "Bricolage Grotesque", sans-serif;
            width: 100vw;
            display: flex;
            flex-direction: column;


        }

        /* --- Headers --- */

        :is(h1, h2, h3) {
            font-weight: 600;
        }

        h1 {
            font-size: var(--font-size-3);
            line-height: var(--line-height-3);
            letter-spacing: var(--letter-space-3);
            text-align: center;

        }

        h2 {
            font-size: var(--font-size-2);
            line-height: var(--line-height-2);
            letter-spacing: var(--letter-space-2);
        }

        h3 {
            font-size: var(--font-size-1);
            line-height: var(--line-height-1);
            letter-spacing: var(--letter-space-1);
        }

        /* --- Alternative Text Sizes --- */

        :is(p, span, a, ul, ol, dl, li, dt, dd, label, blockquote, code) {
            &.small-text {
                font-size: var(--font-size-1b);
                line-height: var(--line-height-1b);
                letter-spacing: var(--letter-space-1b);
            }

            &.large-text {
                font-size: var(--font-size-1);
                line-height: var(--line-height-1);
                letter-spacing: var(--letter-space-1);
            }
        }


        .parent {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            justify-content: center;
            align-items: center;
            padding: 1rem;

        }

        .bg-change {
            width: 80%;
            min-height: 500px;
            background: #000;
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.062);
            box-shadow: inset 0px 0px 0px 1px #0000000f;
        }



        input {
            padding: 1rem;
            border: 1px solid rgba(0, 0, 0, 0.062);
            outline: none;
            border-radius: 20px;
            box-shadow: inset 0px 0px 0px 1px #0000000f;
            background: #ebebeb;
        }


        .btn {
            padding: 0.8rem 2rem;
            background: #ebebeb;
            font-family: inherit;
            border: 1px solid rgb(217, 217, 217);
            border-radius: 20px;
            cursor: pointer;
            box-shadow: inset 0px 0px 0px 1px #0000000f;

        }
    </style>





</head>

<body>





    <div class="parent">

        <div id="bg-change" class="bg-change">

        </div>




        <h1>type to change the bg color</h1>


        <input id="bg-code" type="text" class="bg-code" placeholder="#000000">

        <p style="display: none;" class="input-data-code"></p>




        <button id="btn" class="btn" type="button">Change bg</button>

        <p class="action" style="display: none; color: black;">please add the color code without #</p>








    </div>






    <script>

        const fBtn = document.getElementById("btn");


        function bgChange() {

            const changeBg = document.getElementById("bg-change");
            const bgInput = document.getElementById("bg-code").value.trim();
            const action = document.querySelector(".action");
            const inputData = document.querySelector(".input-data-code");


            if (bgInput === "") {
                action.style.display = "block";
                inputData.style.display = "none";

            }


            else {
                action.style.display = "none";
                const bgCode = `#${bgInput}`;
                changeBg.style.backgroundColor = bgCode;
                inputData.textContent = `your color code is : #${bgInput}`;
                inputData.style.display = "block";
                document.getElementById("bg-code").value = "";
            }

        }



        fBtn.addEventListener("click", bgChange);


        document.addEventListener("keydown", (event) => {

            if (event.key === "Enter") {
                bgChange();
            }

        })



    </script>

</body>

</html>
