<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Typing Animation</title>
  <style>
    .typing {
      font-family: monospace;
      font-size: 2rem;
      white-space: nowrap;
      overflow: hidden;

      border-right: 3px solid #00ff88; /* cursor */
      width: 2px; /* start hidden */
      animation: typing 2s steps(20) forwards, blink 0.8s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 15ch; } /* adjust to text length */
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }
  </style>
</head>
<body>
  <div class="typing">Hello Developer <span class="line"></span></div>
</body>
</html>
