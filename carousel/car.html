<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
    <link rel="stylesheet" href="car.css">
</head>

<body>
    <div class="content">
        <div class="carousel">
            <svg xmlns="http://www.w3.org/2000/svg" class="arrow" id="prev"
                viewBox="0 0 24 24"><!-- Icon from ProIcons by ProCode - https://github.com/ProCode-Software/proicons/blob/main/LICENSE -->
                <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="1.5"
                    d="M20 12H4.121m6.129 6.75l-5.69-5.69A1.5 1.5 0 0 1 4.122 12m6.129-6.75l-5.69 5.69A1.5 1.5 0 0 0 4.122 12" />
            </svg>
            <div class="track">
                <div class="card">
                    <span class="no">1</span>
                </div>
                <div class="card">
                    <span class="no">2</span>
                </div>
                <div class="card">
                    <span class="no">3</span>
                </div>
                <div class="card">
                    <span class="no">4</span>
                </div>
                <div class="card">
                    <span class="no">5</span>
                </div>
                <div class="card">
                    <span class="no">6</span>
                </div>
                <div class="card">
                    <span class="no">7</span>
                </div>
                <div class="card">
                    <span class="no">8</span>
                </div>

            </div>

            <svg xmlns="http://www.w3.org/2000/svg" class="arrow" id="next"
                viewBox="0 0 24 24"><!-- Icon from ProIcons by ProCode - https://github.com/ProCode-Software/proicons/blob/main/LICENSE -->
                <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="1.5"
                    d="M4 12h15.879m-6.129 6.75l5.69-5.69c.292-.292.439-.676.439-1.06M13.75 5.25l5.69 5.69c.292.292.439.676.439 1.06" />
            </svg>
        </div>
    </div>


    <script src="car.js"></script>

</body>

</html>
