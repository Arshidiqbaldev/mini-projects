<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


</head>

<body class="w-full bg-black text-gray-200 text-base">


    <main class="flex w-full  item-center justify-center gap-2">


        <div id="main" class="flex w-full item-center justify-center gap-2 py-20">

            <div id="postGrid" class="w-full grid rows-auto grid-cols-3 gap-5 max-w-400">

            </div>



        </div>



    </main>













    <script>


        async function getData() {
            const demo = document.getElementById("demo");
            const id = document.getElementById("id");
            const main = document.getElementById("main")
            const postGrid = document.getElementById("postGrid")
            const userData = await fetch('https://jsonplaceholder.typicode.com/posts');
            const response = await userData.json();

            response.forEach(element => {
                const postCard = document.createElement("div");
                postCard.className = "card p-4 gap-5 flex flex-col bg-zinc-500/10 border border-gray-500/12 rounded-2xl";
                postCard.innerHTML = `
                
                <h1 class="id text-xl text-gray-500 ">
                    ${element.id}
                </h1>
                <p class="text-2xl text-zinc-300 capitalize ">

                     ${element.title}
                    

                </p>

                 <p class="body text-zinc-400">

                     ${element.body}
                    

                </p>
                
            `;

                postGrid.appendChild(postCard);




            });






            const result = console.log(response);
            console.log(typeof (response));
        }
        getData();





    </script>
</body>

</html>
