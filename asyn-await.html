<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .fadeIn {
            animation: fadeIn 1s ease both;
        }


        @keyframes fadeIn {

            0% {
                transform: translateX(40px);
                opacity: 0;

            }

            100% {
                transform: translateX(0);
                opacity: 1
            }


        }
    </style>
</head>

<body class="w-full bg-black text-gray-200 text-base">
    <main class="flex w-full item-center justify-center gap-2">
        <div id="main" class="flex w-full item-center justify-center gap-2 p-5">
            <div id="postGrid" class="w-full grid rows-auto grid-col-1 md:grid-cols-3 gap-5 max-w-400"></div>
        </div>
    </main>

    <script>
        async function getData() {
            const demo = document.getElementById("demo");
            const id = document.getElementById("id");
            const main = document.getElementById("main");
            const postGrid = document.getElementById("postGrid");
            const userData = await fetch(
                "https://jsonplaceholder.typicode.com/posts",
            );
            const response = await userData.json();

            response.forEach((element) => {
                const postCard = document.createElement("div");
                postCard.className =
                    "card p-4 gap-5 flex flex-col bg-zinc-500/10 border border-gray-500/12 rounded-2xl";
                postCard.innerHTML = `
                
                <h1 class="id text-xl text-gray-500 ">
                    ${element.id}
                </h1>
                <p class="text-2xl text-zinc-300 capitalize ">
                     ${element.title}
                </p>
                 <p class="body text-zinc-400">
                     ${element.body}
                </p>
                
            `;
                postGrid.appendChild(postCard);
            });

            const result = console.log(response);
            console.log(typeof response);


            const observer = new IntersectionObserver(function (entry) {
                entry.forEach((i) => {
                    if (i.isIntersecting) {
                        i.target.classList.add("fadeIn");
                    }
                })
            }, { threshold: 0.10 });

            const cards = document.querySelectorAll(".card");

            cards.forEach((c,index) => {

                observer.observe(c);
                c.style.animationDelay = `${index * 30}ms`;
            });

        }
        getData();




    </script>
</body>

</html>
