<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A review form demo for collecting client names, feedback, and roles in a clean layout.">
    <meta name="keywords" content="review form, testimonial form, feedback UI, front-end demo, JavaScript form">
    <meta name="author" content="Arshid Iqbal">
    <meta name="robots" content="index,follow">
    <meta property="og:title" content="Review Form Demo | Mini Projects">
    <meta property="og:description" content="A review form demo for collecting client names, feedback, and roles in a clean layout.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <title>Review Form Demo | Mini Projects</title>
    <link rel="stylesheet" href="review.css">

</head>


<body>


    <div class="content">
        <div class="formDiv">
            <h1 class="heading">Write a Review</h1>
            <input type="text" id="clientName" placeholder="Name" />
            <textarea id="clientReview" placeholder="Write Review"></textarea>
            <input type="text" id="clientRole" placeholder="Role" />
            <button id="submitReview" onclick="addReview()">Submit</button>
            <p id="error">Please fill in all fields!</p>
        </div>


        <div class="reviewSec">
            <h2 class="heading"> Client Reviews</h2>

            <div id="reviewGrid">

            </div>

        </div>

    </div>



    <script src="review.js"></script>
</body>

</html>
