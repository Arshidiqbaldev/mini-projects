<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A hover fill animation demo with multiple button transition directions and effects.">
    <meta name="keywords" content="hover animation, button effects, CSS animation, front-end demo, interactive buttons">
    <meta name="author" content="Arshid Iqbal">
    <meta name="robots" content="index,follow">
    <meta property="og:title" content="Hover Fill Animations | Mini Projects">
    <meta property="og:description" content="A hover fill animation demo with multiple button transition directions and effects.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <title>Hover Fill Animations | Mini Projects</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }





        body {
            font-family: Arial, sans-serif;
            background: #1f1f1f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .btn-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            max-width: 900px;
            justify-content: center;
        }

        .btn {
            position: relative;
            display: inline-block;
            padding: 12px 24px;
            color: #bfbfbf;
            text-decoration: none;
            font-weight: 600;
            border: 2px solid #333;
            border-radius: 10px;
            overflow: hidden;
            transition: color 0.3s ease;
        }

        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 4px;
            background: #333;
            z-index: -1;
            transition: transform 0.4s ease, width 0.3s ease, height 0.3s ease;
        }

        .btn:hover {
            color: #fff;
        }

        /* 1. Left → Right Fill */
        .fill-left::before {
            transform: scaleX(0);
            transform-origin: left;
        }

        .fill-left:hover::before {
            transform: scaleX(1);
        }

        /* 2. Right → Left Fill */
        .fill-right::before {
            transform: scaleX(0);
            transform-origin: right;
        }

        .fill-right:hover::before {
            transform: scaleX(1);
        }

        /* 3. Top → Bottom Fill */
        .fill-top::before {
            transform: scaleY(0);
            transform-origin: top;
        }

        .fill-top:hover::before {
            transform: scaleY(1);
        }

        /* 4. Bottom → Top Fill */
        .fill-bottom::before {
            transform: scaleY(0);
            transform-origin: bottom;
        }

        .fill-bottom:hover::before {
            transform: scaleY(1);
        }

        /* 5. Center Expand */
        .expand-center::before {
            transform: scale(0);
            transform-origin: center;
        }

        .expand-center:hover::before {
            transform: scale(1);
        }

        /* 6. Horizontal Split */
        .split-horizontal::before {
            transform: scaleY(0);
            transform-origin: center;
        }

        .split-horizontal:hover::before {
            transform: scaleY(1);
        }

        /* 7. Vertical Split */
        .split-vertical::before {
            transform: scaleX(0);
            transform-origin: center;
        }

        .split-vertical:hover::before {
            transform: scaleX(1);
        }

        /* 8. Diagonal Sweep */
        .sweep-diagonal::before {
            transform: translateX(-100%) rotate(40deg);
            transform-origin: left top;
        }

        .sweep-diagonal:hover::before {
            transform: translateX(0) rotate(40deg);
        }

        /* 9. Skew Slide */
        .skew-slide::before {
            transform: translateX(-110%) skewX(-30deg);
        }

        .skew-slide:hover::before {
            transform: translateX(0) skewX(-30deg);
        }

        /* 10. Shine Sweep */
        .shine-sweep::before {
            background: linear-gradient(130deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            filter: blur(4px);
            transform: translateX(-100%);
        }

        .shine-sweep:hover::before {
            transform: translateX(100%);
        }

        /* 11. Border Draw */
        .border-draw {
            outline: none;
            overflow: visible;
            border: none;
        }

        .border-draw::before {
            border: 2px solid #333;
            width: 0;
            height: 0;
            top: 0;
            left: 0;
            background: transparent;

        }

        .border-draw:hover::before {

            width: 98%;
            height: 90%;
        }

        /* 12. Underline Slide */
        .underline-slide {
            border: none;
        }

        .underline-slide::before {
            bottom: 0;
            left: 0;
            height: 2px;
            width: 0;
            background: #333;
            top: auto;
        }

        .underline-slide:hover::before {
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="btn-container">
        <a href="#" class="btn fill-left">Left → Right Fill</a>
        <a href="#" class="btn fill-right">Right → Left Fill</a>
        <a href="#" class="btn fill-top">Top → Bottom Fill</a>
        <a href="#" class="btn fill-bottom">Bottom → Top Fill</a>
        <a href="#" class="btn expand-center">Center Expand</a>
        <a href="#" class="btn split-horizontal">Horizontal Split</a>
        <a href="#" class="btn split-vertical">Vertical Split</a>
        <a href="#" class="btn sweep-diagonal">Diagonal Sweep</a>
        <a href="#" class="btn skew-slide">Skew Slide</a>
        <a href="#" class="btn shine-sweep">Shine Sweep</a>
        <a href="#" class="btn border-draw">Border Draw</a>
        <a href="#" class="btn underline-slide">Underline Slide</a>
    </div>
</body>

</html>
